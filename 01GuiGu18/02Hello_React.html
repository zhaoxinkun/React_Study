<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!--    第一步,引入React-->
    <script src="https://cdn.jsdelivr.net/npm/react@16.8.0/umd/react.development.js"></script>
    <!--    第二步,引入react-dom 用于支持react操作DOM-->
    <script src="https://cdn.jsdelivr.net/npm/react-dom@16.8.0/umd/react-dom.production.min.js"></script>
    <!--    第三步,引入babel 用于将jsx转为js-->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body>
<!--第四步,创建DOM元素-->
<div id="root"></div>

<!--此处一定要写babel-->
<script type="text/babel">
    // 第五步,创建Vdom
    const VDOM = (
        /* 此处一定不要写引号，因为不是字符串 */
        <div>
            <h1>Hello React</h1>
        </div>
    )

    // 第六步,渲染虚拟DOM到页面
    ReactDOM.render(VDOM, document.getElementById('root'))
</script>
</body>
</html>
