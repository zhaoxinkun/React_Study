<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!--    第一步,引入React-->
    <script src="https://cdn.jsdelivr.net/npm/react@16.8.0/umd/react.development.js"></script>
    <!--    第二步,引入react-dom 用于支持react操作DOM-->
    <script src="https://cdn.jsdelivr.net/npm/react-dom@16.8.0/umd/react-dom.production.min.js"></script>
    <!--    第三步,引入babel 用于将jsx转为js-->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

</head>
<body>
<div id="root"></div>

<script type="text/javascript">

    // 1. 创建一个类
    class Person {
        // 2. 构造器方法,用于执行初始化操作,this是该类的实例对象,  类中的构造器不是必须要写的，要对实例进行一些初始化的操作，如添加指定属性时才写。
        constructor(name, age) {
            //构造器中的this是谁？—— 类的实例对象
            this.name = name;
            this.age = age;

            // 3. 实例方法(每次都是新的,不共享)
            this.sayHello = function () {
                return "Hello" + this.name;
            }
        }

        // 4. 一般方法,原型方法
        spack() {
            //speak方法放在了哪里？——类的原型对象上，供实例使用
            //通过Person实例调用speak时，speak中的this就是Person实例
            console.log("Hello", this.name, "我今年", this.age);
        }


    }

    // 实例化对象
    const p1 = new Person("tom", 22)
    console.log("🚀 ~  ~ p1: ", p1);
    const p2 = new Person("Jerry", 30)
    console.log("🚀 ~  ~ p2: ", p2);
    console.log(p1.sayHello())
    console.log(p2.sayHello())


</script>
</body>
</html>
