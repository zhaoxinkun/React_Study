<html lang="en">
<head>

    <title>Title</title>
    <!--    第一步,引入React-->

</head>
<body>
<div id="root"></div>

<script type="text/javascript">

    // 1. 创建一个类
    class Person {
        // 2. 构造器方法,用于执行初始化操作,this是该类的实例对象
        constructor(name, age) {
            this.name = name;
            this.age = age;
        }

        // 3. 一般方法

    }

    // 实例化对象

    const p2 = new Person("Jerry", 22)

</script>

</html>
