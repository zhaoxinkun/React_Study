<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react/18.1.0/umd/react.development.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.1.0/umd/react-dom.development.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

    const VDOM = (
        <h1>hello react</h1>
    )

    ReactDOM.createRoot(document.getElementById('root')).render(VDOM)


    // 虚拟DOM
    console.log(VDOM)

    // 真实DOM
    const h = document.getElementById("root")
    console.log(h)
</script>

</body>
</html>
