<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react/18.1.0/umd/react.development.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.1.0/umd/react-dom.development.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    // 类式组件
    class App extends React.Component {

        render() {
            return (
                <>
                    <h1>event binding</h1>
                    <button onClick={this.demo}>点击</button>
                </>
            )
        }

        // 正确的函数
        demo() {
            console.log("haha")
        }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>)

    // 不可这么写,扰乱结构,this不便
    // function demo() {
    //     console.log("haha")
    // }
</script>

</body>
</html>
