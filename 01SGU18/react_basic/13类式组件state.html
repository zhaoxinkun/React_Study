<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react/18.1.0/umd/react.development.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.1.0/umd/react-dom.development.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    // 类式组件
    class App extends React.Component {
        // 01 旧版本书写state
        constructor(props) {
            super(props);
            this.state = {name: "akin"}
        }

        // 02 新版本写state
        state = {name2: "akin2"}

        render() {
            // 可以解构出来
            const {name} = this.state
            return (
                <>
                    {/* 01旧版本*/}
                    <h1>this is class Component {name}</h1>
                    {/* 02新版本*/}
                    <h1>this is class Component {this.state.name2}</h1>
                </>

            )
        }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>

</body>
</html>
