<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react/18.1.0/umd/react.development.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.1.0/umd/react-dom.development.js"></script>
    <style>
        .title {
            background-color: red;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

    const name = "react";

    const VDOM = (
        // 01 根标签只能有一个
        <>

            {/* 02使用{}写JS的表达式(不是语句!!)*/}

            {/*03这才是JSX的注释写法*/}

            {/*04class不能写,需要写为className*/}
            <h1 className="title">hello {name}</h1>

            {/*05这里是style的写法*/}
            <h2 style={{color: "red", width: "200px"}}>Hello akin</h2>
        </>

    )

    // 06 组件名大写
    ReactDOM.createRoot(document.getElementById('root')).render(VDOM)
</script>

</body>
</html>
