<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react/18.1.0/umd/react.development.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.1.0/umd/react-dom.development.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    // 类式组件
    class App extends React.Component {
        constructor(props) {
            super(props);
        }

        state = {name: "akin"}

        render() {
            const {name} = this.state
            return (
                <>
                    <h1>use setState</h1>
                    <button onClick={this.demo}>点击{name}</button>
                </>
            )
        }

        // 箭头函数方式拿到this
        demo = () => {
            console.log(this.state.name)  //使用bind才可以访问this.state 不然类方法内部,自动的局部严格模式
            // 使用props
            this.setState({name: this.props.PropsName})
        }
    }

    // 组件标签处传递props
    ReactDOM.createRoot(document.getElementById('root')).render(<App PropsName={"PropsName"}/>)
</script>

</body>
</html>
